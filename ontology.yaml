description: >
  Coverage-frozen hierarchical chest X-ray ontology for ViSiG-CR. It includes
  the 41 CoNNS concepts, common CheXpert/MS-CXR targets, and a limited alpha
  extension for devices, technical context, location-sensitive findings, and
  external-dataset portability. Coverage is paper-ready in scope, but clinical
  validity still requires the audit protocol documented in ONTOLOGY_VALIDATION.md.

metadata:
  name: ViSiG-CR CXR Concept Ontology
  scope: frontal adult chest radiography
  release_status: coverage_frozen_candidate
  clinical_validation_required: true
  query_setting: target_explicit
  graph_entry: visual_only
  intended_tasks:
    - report_concept_event_extraction
    - question_target_selection
    - visual_case_graph_construction
    - question_conditioned_evidence_retrieval
  exclusions:
    - open_ended_diagnosis_as_primary_task
    - temporal_prior_reasoning_as_primary_task
    - pediatric_specific_ontology
    - CT_only_findings
  provenance:
    conns_41: Concept-Guided Noisy Negative Suppression ontology concepts
    chexpert_14: MIMIC-CXR-JPG and CheXpert label vocabulary
    ms_cxr_8: MS-CXR phrase-grounding findings
    visig_cr_alpha: retrieval-specific devices, technical context, and location-sensitive extensions

# Deterministic evidence-to-concept support policy. Direct support is generated
# automatically from each finding label and synonym. The patterns below are the
# deliberately small set of clinically safe implications that do not literally
# contain the target finding name (for example, normal heart size -> absent
# cardiomegaly). They are part of the ontology hash and therefore part of the
# extraction/resume identity.
semantic_support:
  schema_version: visig_cr_semantic_support_v1
  present_only_findings:
    - no_acute_cardiopulmonary_abnormality
    - normal_lung_transparency
    - normal_cardiac_silhouette
    - normal_hilar_contour
    - intact_osseous_structures
    - low_lung_volume
    - support_device
    - rotation
    - underpenetration
    - portable_ap_projection
  direct_anchor_patterns:
    pleural_effusion:
      - '\b(?:pleural\s+)?effusions\b'
    pneumothorax:
      - '\bpneumothoraces\b'
    fracture:
      - '\bfractures\b'
    lung_opacity:
      - '\bopacit(?:y|ies)\b'
    consolidation:
      - '\bconsolidations\b'
      - '\bconsolidative\s+(?:opacity|opacities|process|component)\b'
    atelectasis:
      - '\batelectatic\s+changes?\b'
      - '\b(?:right|left)?\s*(?:upper|middle|lower)?\s*lobe\s+collapse\b'
      - '\b(?:right|left)?\s*(?:upper|middle|lower)?\s*lobe\s+(?:is\s+)?collapsed\b'
    cardiomegaly:
      - '\b(?:the\s+)?(?:heart(?:\s+size)?|cardiac\s+silhouette)\s+(?:is|appears|remains)?\s*(?:(?:mildly|moderately|severely|slightly|borderline)\s+)?enlarged\b'
      - '\b(?:mild|moderate|severe|slight|borderline)(?:\s+to\s+(?:moderate|severe))?\s+enlargement\s+of\s+(?:the\s+)?cardiac\s+silhouette\b'
    low_lung_volume:
      - '\blung\s+volumes?\s+(?:are|is|remain|remains)?\s*(?:persistently\s+)?low\b'
      - '\b(?:the\s+)?lungs?\s+(?:are|is)?\s*low\s+in\s+volume\b'
    hemidiaphragm_elevation:
      - '\belevation\s+of\s+(?:the\s+)?(?:right|left)?\s*hemidiaphragm\b'
      - '\beventration\s+of\s+(?:the\s+)?(?:right|left)?\s*hemidiaphragm\b'
    mediastinal_widening:
      - '\bwidening\s+of\s+(?:the\s+)?(?:upper\s+|superior\s+)?mediastinum\b'
      - '\bwidening\s+of\s+(?:the\s+)?mediastinal\s+contour\b'
      - '\b(?:the\s+)?mediastinum\s+(?:is|appears|remains)?\s*(?:slightly|mildly|moderately|markedly)?\s*widened\b'
    central_venous_catheter:
      - '\b(?:right|left)?\s*(?:internal\s+jugular|ij|subclavian)\s+(?:venous\s+)?(?:line|catheter)\b'
      - '\b(?:hemo)?dialysis\s+catheter\b'
      - '\bport-?a-?cath\b'
    aortic_elongation:
      - '\b(?:the\s+)?(?:thoracic\s+|descending\s+)?aorta\s+(?:is|appears|remains)?\s*(?:mildly|slightly)?\s*tortuous\b'
      - '\btortuosity\s+of\s+(?:the\s+)?(?:thoracic\s+|descending\s+)?aorta\b'
      - '\belongation\s+of\s+(?:the\s+)?aorta\b'
    aortic_atherosclerosis:
      - '\b(?:atherosclerotic\s+)?calcifications?\s+(?:of|along)\s+(?:the\s+)?(?:thoracic\s+)?aorta\b'
      - '\b(?:the\s+)?(?:thoracic\s+)?aorta\s+(?:is|appears)?\s*calcified\b'
    vertebral_degenerative_change:
      - '\bdegenerative\s+changes?\s+(?:of|in|involving)\s+(?:the\s+)?thoracic\s+spine\b'
    vascular_congestion:
      - '\bprominen(?:ce|t)\s+of\s+(?:the\s+)?pulmonary\s+vasculature\b'
      - '\bpulmonary\s+vasculature\s+(?:is|appears)?\s*(?:mildly\s+)?engorged\b'
      - '\bupper\s+zone\s+(?:vascular\s+)?redistribution\b'
      - '\b(?:vascular\s+)?cephalization\b'
      - '\bcentral\s+pulmonary\s+venous\s+congestion\b'
  curated_implications:
    no_acute_cardiopulmonary_abnormality:
      present:
        - '\bno\s+(?:acute|active)\s+(?:cardiopulmonary|chest)\s+(?:abnormality|process|disease|findings?)\b'
    normal_lung_transparency:
      present:
        - '\b(?:the\s+)?(?:lungs?|lung\s+fields?)\s+(?:are|is|appear|appears|remain|remains)?\s*(?:clear|unremarkable)\b'
        - '\b(?:the\s+)?(?:lungs?|lung\s+fields?)\s+(?:are|appear|remain)\s+(?:otherwise\s+|well\s+expanded\s+and\s+)?(?:clear|unremarkable)\b'
    normal_cardiac_silhouette:
      present:
        - '\b(?:the\s+)?(?:heart\s+and\s+mediastinal\s+contours|heart(?:\s+size)?|cardiac\s+silhouette)\s+(?:is|are|appear|appears|remain|remains)?\s*(?:within\s+normal\s+limits|normal(?:\s+in\s+size)?|not\s+enlarged)\b'
        - '\b(?:the\s+)?cardiomediastinal\s+silhouette\s+(?:is|appears|remains)?\s*(?:within\s+normal\s+limits|normal|unremarkable|not\s+enlarged)\b'
        - '\bcardiac(?:,|\s+and)\s+mediastinal(?:\s+and\s+hilar)?\s+contours?\s+(?:are|appear|remain)?\s*(?:normal|unremarkable)\b'
    cardiomegaly:
      present:
        - '\b(?:the\s+)?(?:heart(?:\s+size)?|cardiac\s+silhouette)\s+(?:is|appears|remains)?\s*(?:enlarged|increased)\b'
      absent:
        - '\b(?:the\s+)?(?:heart\s+and\s+mediastinal\s+contours|heart(?:\s+size)?|cardiac\s+silhouette)\s+(?:is|are|appear|appears|remain|remains)?\s*(?:within\s+normal\s+limits|normal(?:\s+in\s+size)?|not\s+enlarged)\b'
        - '\b(?:the\s+)?cardiomediastinal\s+silhouette\s+(?:is|appears|remains)?\s*(?:within\s+normal\s+limits|normal|unremarkable|not\s+enlarged)\b'
        - '\bcardiac(?:,|\s+and)\s+mediastinal(?:\s+and\s+hilar)?\s+contours?\s+(?:are|appear|remain)?\s*(?:normal|unremarkable)\b'
    normal_hilar_contour:
      present:
        - '\b(?:the\s+)?(?:hila|hilar\s+contours?)\s+(?:are|is|appear|appears|remain|remains)?\s*(?:normal|unremarkable)\b'
        - '\b(?:the\s+)?hilar\s+structures?\s+(?:are|appear|remain)?\s*(?:normal|unremarkable)\b'
    intact_osseous_structures:
      present:
        - '\b(?:the\s+)?(?:visualized\s+)?(?:osseous|bony)\s+structures?\s+(?:are|is|appear|appears|remain|remains)?\s*(?:intact|unremarkable)\b'
        - '\bno\s+acute\s+(?:osseous|bony)\s+abnormalit(?:y|ies)\b'
        - '\bno\s+acute\s+bone\s+abnormalit(?:y|ies)\b'
    lung_mass:
      absent:
        - '\bno\s+(?:focal\s+)?(?:pulmonary\s+|lung\s+)?mass(?:es)?\b'

findings:
  cxr_finding:
    label: CXR finding
    description: Root node for all represented chest radiograph concepts.
    parent: null
    abstract: true
    extractable: false
    selectable: false
    synonyms: []

  # -----------------------------------------------------------------------
  # Normal and rule-out descriptors. These are stored for coverage/audit but
  # are retained for audit but excluded from online comparison candidates.
  # -----------------------------------------------------------------------
  normal_descriptor:
    label: normal descriptor
    description: Explicitly normal radiographic descriptor.
    parent: cxr_finding
    abstract: true
    extractable: false
    selectable: false
    synonyms: []
  no_acute_cardiopulmonary_abnormality:
    label: no acute cardiopulmonary abnormality
    description: Explicit global statement that no acute cardiopulmonary abnormality is seen.
    parent: normal_descriptor
    extractable: true
    selectable: false
    default_anatomy: thorax
    allowed_anatomy: [thorax]
    retrieval_policy: context_only
    coverage_tier: alpha
    synonyms: [no acute cardiopulmonary abnormality, no acute cardiopulmonary process, no acute cardiopulmonary findings, no active cardiopulmonary disease, no acute disease]
  normal_lung_transparency:
    label: normal lung transparency
    description: Explicitly normal lung transparency or clear lungs.
    parent: normal_descriptor
    extractable: true
    selectable: false
    default_anatomy: lung
    allowed_anatomy: [lung]
    retrieval_policy: context_only
    coverage_tier: conns_41
    synonyms: [normal lung transparency, clear lungs, lungs are clear, lung fields are clear]
  normal_cardiac_silhouette:
    label: normal cardiac silhouette
    description: Explicitly normal cardiac size or silhouette.
    parent: normal_descriptor
    extractable: true
    selectable: false
    default_anatomy: cardiac_silhouette
    allowed_anatomy: [heart, cardiac_silhouette]
    retrieval_policy: context_only
    coverage_tier: conns_41
    synonyms: [normal cardiac silhouette, normal heart size, cardiac silhouette is normal, heart is normal in size, heart size is normal, heart and mediastinal contours are normal]
  normal_hilar_contour:
    label: normal hilar contour
    description: Explicitly normal hilar contour.
    parent: normal_descriptor
    extractable: true
    selectable: false
    default_anatomy: hilum
    allowed_anatomy: [hilum]
    retrieval_policy: context_only
    coverage_tier: conns_41
    synonyms: [normal hilar contour, normal hila, hila are normal]
  intact_osseous_structures:
    label: intact osseous structures
    description: Explicitly intact visible osseous structures.
    parent: normal_descriptor
    extractable: true
    selectable: false
    default_anatomy: bone
    allowed_anatomy: [bone, rib, clavicle, spine, shoulder_girdle]
    retrieval_policy: context_only
    coverage_tier: conns_41
    synonyms: [intact osseous structures, no acute osseous abnormality, no acute bony abnormality, bones are intact]

  # -----------------------------------------------------------------------
  # Pleural findings
  # -----------------------------------------------------------------------
  pleural_abnormality:
    label: pleural abnormality
    description: Abnormality involving the pleura or pleural space.
    parent: cxr_finding
    abstract: true
    extractable: false
    selectable: true
    default_anatomy: pleura
    synonyms: [pleural abnormality, pleural disease]
  pleural_effusion:
    label: pleural effusion
    description: Pleural fluid, layering fluid, or costophrenic blunting compatible with effusion.
    parent: pleural_abnormality
    extractable: true
    selectable: true
    default_anatomy: pleural_space
    allowed_anatomy: [pleural_space, pleura, costophrenic_angle, lower_lung_zone, thorax]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity]
    synonyms: [pleural effusion, pleural fluid, effusion, costophrenic blunting]
  pneumothorax:
    label: pneumothorax
    description: Air in the pleural space.
    parent: pleural_abnormality
    extractable: true
    selectable: true
    default_anatomy: pleural_space
    allowed_anatomy: [pleural_space, pleura, apex, thorax]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity]
    synonyms: [pneumothorax, pleural air]
  pleural_thickening:
    label: pleural thickening
    description: Pleural thickening, plaque, or pleural scarring.
    parent: pleural_abnormality
    extractable: true
    selectable: true
    default_anatomy: pleura
    allowed_anatomy: [pleura, pleural_space, apex, chest_wall, thorax]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy]
    synonyms: [pleural thickening, pleural scarring, pleural plaque]
  subcutaneous_emphysema:
    label: subcutaneous emphysema
    description: Gas in the chest wall or subcutaneous soft tissues.
    parent: pleural_abnormality
    extractable: true
    selectable: true
    default_anatomy: subcutaneous_tissue
    allowed_anatomy: [subcutaneous_tissue, chest_wall, thorax]
    retrieval_policy: clinical
    coverage_tier: alpha
    question_attributes: [presence, laterality, anatomy]
    synonyms: [subcutaneous emphysema, subcutaneous gas, chest wall emphysema]

  # -----------------------------------------------------------------------
  # Pulmonary opacity and airspace findings
  # -----------------------------------------------------------------------
  parenchymal_abnormality:
    label: parenchymal abnormality
    description: Abnormality of the lung parenchyma.
    parent: cxr_finding
    abstract: true
    extractable: false
    selectable: true
    default_anatomy: lung
    synonyms: [parenchymal abnormality, pulmonary parenchymal abnormality]
  parenchymal_opacity:
    label: parenchymal opacity family
    description: Broad family of pulmonary opacities and airspace patterns.
    parent: parenchymal_abnormality
    abstract: true
    extractable: false
    selectable: true
    default_anatomy: lung
    synonyms: [parenchymal opacity, airspace abnormality]
  lung_opacity:
    label: lung opacity
    description: Non-specific pulmonary opacity.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [lung opacity, pulmonary opacity, airspace opacity]
  increased_density:
    label: increased density
    description: Non-specific increased pulmonary density stated in the report.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy, finding_identity]
    synonyms: [increased density, focal density, pulmonary density]
  infiltrate:
    label: infiltrate
    description: Reported pulmonary infiltrate without a more specific canonical diagnosis.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy, finding_identity]
    synonyms: [infiltrate, pulmonary infiltrate, infiltrates]
  alveolar_pattern:
    label: alveolar pattern
    description: Alveolar or airspace pattern not otherwise specified.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, perihilar_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [alveolar pattern, alveolar opacity, alveolar airspace pattern]
  atelectasis:
    label: atelectasis
    description: Subsegmental, plate-like, lobar, or compressive atelectasis.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [atelectasis, subsegmental atelectasis, basilar atelectasis, linear atelectasis]
  consolidation:
    label: consolidation
    description: Airspace consolidation.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [consolidation, airspace consolidation, focal consolidation]
  pneumonia:
    label: pneumonia
    description: Reported pneumonia or infectious airspace process.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, base, perihilar_region, retrocardiac_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [pneumonia, pulmonary infection, infectious airspace disease]
  pulmonary_edema:
    label: pulmonary edema
    description: Interstitial or alveolar pulmonary edema.
    parent: parenchymal_opacity
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, perihilar_region, lower_lung_zone]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, severity, anatomy, finding_identity]
    synonyms: [pulmonary edema, interstitial edema, alveolar edema, edema]

  # -----------------------------------------------------------------------
  # Interstitial/chronic lung findings
  # -----------------------------------------------------------------------
  chronic_interstitial_abnormality:
    label: chronic or interstitial lung abnormality
    description: Chronic interstitial, fibrotic, or bronchial abnormality.
    parent: parenchymal_abnormality
    abstract: true
    extractable: false
    selectable: true
    default_anatomy: lung
    synonyms: [chronic lung abnormality, interstitial lung abnormality]
  interstitial_pattern:
    label: interstitial pattern
    description: Interstitial pulmonary pattern.
    parent: chronic_interstitial_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, perihilar_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [interstitial pattern, interstitial opacity, interstitial markings]
  pulmonary_fibrosis:
    label: pulmonary fibrosis
    description: Fibrotic interstitial lung disease or pulmonary fibrosis.
    parent: chronic_interstitial_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, lower_lung_zone, apex, base]
    retrieval_policy: clinical
    coverage_tier: alpha
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [pulmonary fibrosis, interstitial fibrosis, fibrotic lung disease]
  fibrotic_band:
    label: fibrotic band
    description: Linear fibrotic band or focal scarring.
    parent: chronic_interstitial_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy]
    synonyms: [fibrotic band, fibrous band, linear scarring]
  chronic_lung_change:
    label: chronic lung change
    description: Non-specific chronic pulmonary change.
    parent: chronic_interstitial_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, apex, base]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy]
    synonyms: [chronic changes, chronic lung changes, chronic pulmonary changes]
  bronchiectasis:
    label: bronchiectasis
    description: Bronchial dilatation compatible with bronchiectasis.
    parent: chronic_interstitial_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lobe, middle_lobe, lower_lobe, base]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, anatomy]
    synonyms: [bronchiectasis, bronchial ectasia]

  # -----------------------------------------------------------------------
  # Lung volume / obstructive pattern
  # -----------------------------------------------------------------------
  lung_volume_abnormality:
    label: lung volume abnormality
    description: Abnormally increased or decreased lung volume.
    parent: parenchymal_abnormality
    abstract: true
    extractable: false
    selectable: true
    default_anatomy: lung
    synonyms: [lung volume abnormality]
  hyperinflation:
    label: hyperinflation
    description: Hyperexpanded or hyperinflated lungs.
    parent: lung_volume_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, thorax]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, severity]
    synonyms: [hyperinflation, hyperinflated lung, hyperexpanded lungs]
  emphysema:
    label: emphysema
    description: Radiographic emphysematous change.
    parent: lung_volume_abnormality
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, lower_lung_zone, apex]
    retrieval_policy: clinical
    coverage_tier: alpha
    question_attributes: [presence, severity, anatomy]
    synonyms: [emphysema, emphysematous change]
  low_lung_volume:
    label: low lung volume
    description: Hypoexpansion or low inspiratory lung volume.
    parent: lung_volume_abnormality
    extractable: true
