  lung_nodule:
    label: lung nodule
    description: Pulmonary nodule.
    parent: focal_lung_lesion
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base, perihilar_region]
    retrieval_policy: clinical
    coverage_tier: conns_41
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [lung nodule, pulmonary nodule, nodule]
  lung_mass:
    label: lung mass
    description: Pulmonary mass.
    parent: focal_lung_lesion
    extractable: true
    selectable: true
    default_anatomy: lung
    allowed_anatomy: [lung, upper_lung_zone, mid_lung_zone, lower_lung_zone, upper_lobe, middle_lobe, lower_lobe, apex, base, perihilar_region]
    retrieval_policy: clinical
    coverage_tier: alpha
    question_attributes: [presence, laterality, severity, anatomy, finding_identity]
    synonyms: [lung mass, pulmonary mass]
